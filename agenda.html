<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda | Eleição 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-brand">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Eleição 2026</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="agenda.html">Agenda</a></li>
          <li class="nav-item"><a class="nav-link" href="verificar.html">Planilhas</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html">Registros</a></li>
          <li class="nav-item"><button type="button" id="btnSair" class="btn btn-sm btn-outline-light ms-lg-2 mt-2 mt-lg-0">Sair</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-3 py-md-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 mb-0">Agenda da campanha</h1>
      <button type="button" id="btnNova" class="btn btn-sm btn-primary">
        Nova atividade
      </button>
    </div>

    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div id="calendario"></div>
      </div>
    </div>
  </main>

  <!-- Modal: nova atividade -->
  <div class="modal fade" id="modalEvento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formEvento">
          <div class="modal-header">
            <h2 class="modal-title h5">Nova atividade</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="evTitulo" class="form-label">Título</label>
              <input type="text" id="evTitulo" class="form-control" required />
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="evDiaInteiro" />
              <label class="form-check-label" for="evDiaInteiro">Dia inteiro</label>
            </div>
            <div class="row g-3">
              <div class="col-12 col-sm-6">
                <label for="evInicio" class="form-label">Início</label>
                <input type="datetime-local" id="evInicio" class="form-control" required />
              </div>
              <div class="col-12 col-sm-6">
                <label for="evFim" class="form-label">Fim</label>
                <input type="datetime-local" id="evFim" class="form-control" />
              </div>
            </div>
            <div class="mb-3 mt-3">
              <label for="evLocal" class="form-label">Local</label>
              <input type="text" id="evLocal" class="form-control" />
            </div>
            <div class="mb-3">
              <label for="evDescricao" class="form-label">Descrição</label>
              <textarea id="evDescricao" rows="2" class="form-control"></textarea>
            </div>
            <div class="mb-1">
              <label for="evLembrete" class="form-label">Lembrete (minutos antes)</label>
              <input type="number" id="evLembrete" class="form-control" min="0" />
            </div>
            <div id="statusModal" class="alert d-none mt-3" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" id="btnSalvarEvento" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: detalhes do evento -->
  <div class="modal fade" id="modalDetalhe" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="detTitulo">Atividade</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1"><strong>Quando:</strong> <span id="detQuando"></span></p>
          <p class="mb-1"><strong>Local:</strong> <span id="detLocal"></span></p>
          <p class="mb-0"><strong>Descrição:</strong> <span id="detDescricao"></span></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="border-top bg-white py-3 mt-4">
    <div class="container">
      <small class="text-secondary">Projeto Eleição 2026 &middot; Google Agenda</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales-all.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/agenda.js"></script>
</body>
</html>
