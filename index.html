<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eleição 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-brand">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Eleição 2026</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="agenda.html">agenda</a></li>
          <li class="nav-item"><a class="nav-link" href="verificar.html">planilhas</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">registros</a></li>
          <li class="nav-item"><button type="button" id="btnSair" class="btn btn-sm btn-outline-light ms-lg-2 mt-2 mt-lg-0">sair</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-3 py-md-4">
    <!-- Hero / acesso rápido -->
    <section class="card border-start border-4 border-primary shadow-sm mb-3">
      <div class="card-body d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
        <div>
          <h2 class="h5 mb-1">painel de projeções</h2>
          <p class="text-secondary mb-0">cards e gráficos de projeção mínima e ideal de votação.</p>
        </div>
        <div class="d-grid d-sm-flex gap-2">
          <a href="dashboard.html" class="btn btn-primary">abrir dashboard</a>
          <a href="verificar.html" class="btn btn-outline-secondary">verificar planilhas</a>
        </div>
      </div>
    </section>

    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <!-- Novo registro -->
    <section class="card shadow-sm mb-3">
      <div class="card-body">
        <h2 class="h5 card-title mb-3">Novo registro</h2>
        <form id="formRegistro" autocomplete="off">
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" id="nome" name="nome" class="form-control" required />
            </div>
            <div class="col-12 col-md-6">
              <label for="cidade" class="form-label">Cidade</label>
              <input type="text" id="cidade" name="cidade" class="form-control" required />
            </div>
            <div class="col-12">
              <label for="observacao" class="form-label">Observação</label>
              <textarea id="observacao" name="observacao" rows="3" class="form-control"></textarea>
            </div>
            <div class="col-12 d-grid d-sm-block">
              <button type="submit" id="btnEnviar" class="btn btn-primary">Salvar</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- Registros -->
    <section class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h5 card-title mb-0">Registros</h2>
          <button type="button" id="btnAtualizar" class="btn btn-sm btn-outline-secondary">
            Atualizar
          </button>
        </div>
        <div class="table-responsive">
          <table id="tabelaDados" class="table table-striped table-hover align-middle mb-0">
            <thead>
              <tr id="cabecalhoTabela"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
          <p id="vazio" class="text-secondary text-center py-3 mb-0" hidden>
            Nenhum registro encontrado.
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-top bg-white py-3 mt-4">
    <div class="container">
      <small class="text-secondary">Projeto Eleição 2026 &middot; dados no Google Sheets</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
