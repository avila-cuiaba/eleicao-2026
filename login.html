<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso | Eleição 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="text-center mb-4">
          <h1 class="h3 text-brand fw-bold">Eleição 2026</h1>
          <p class="text-secondary">Acesso restrito</p>
        </div>

        <div class="card shadow-sm">
          <div class="card-body">
            <div id="status" class="alert d-none" role="alert"></div>
            <form id="formLogin" autocomplete="off">
              <div class="mb-3">
                <label for="chave" class="form-label">Chave de acesso</label>
                <input type="password" id="chave" class="form-control" required autofocus />
              </div>
              <div class="d-grid">
                <button type="submit" id="btnEntrar" class="btn btn-primary">Entrar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
