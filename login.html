<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>acesso | Eleição 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light login-page">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="login-brand text-center mb-4">
          <div class="login-icon-cluster" aria-hidden="true">
            <span class="login-icon login-icon--lock">
              <span class="login-icon-mover">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                  <rect x="5" y="11" width="14" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
              </span>
            </span>
            <span class="login-icon login-icon--key">
              <span class="login-icon-mover">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                  <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
              </span>
            </span>
            <span class="login-icon login-icon--shield">
              <span class="login-icon-mover">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
              </span>
            </span>
          </div>
          <h1 class="h3 text-brand fw-bold mb-1">Eleição 2026</h1>
          <p class="login-subtitulo text-secondary mb-0">acesso restrito</p>
        </div>

        <div class="card shadow-sm login-card border-0">
          <div class="card-body">
            <div id="status" class="alert d-none" role="alert"></div>
            <form id="formLogin" autocomplete="off">
              <div class="mb-3">
                <label for="chave" class="form-label login-label">chave de acesso</label>
                <div class="input-group login-input-group">
                  <span class="input-group-text login-input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                      <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                    </svg>
                  </span>
                  <input type="password" id="chave" class="form-control login-input" required autofocus />
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" id="btnEntrar" class="btn btn-primary login-btn">
                  <span class="login-btn-estado login-btn-estado--padrao">
                    <span class="login-btn-icone" aria-hidden="true">
                      <svg class="login-btn-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                        <rect x="5" y="11" width="14" height="10" rx="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                      </svg>
                    </span>
                    <span class="login-btn-texto">entrar</span>
                  </span>
                  <span class="login-btn-estado login-btn-estado--carregando" aria-hidden="true">
                    <span class="login-btn-spinner"></span>
                    <span class="login-btn-texto login-btn-texto--carregando">verificando<span class="login-btn-pontos" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></span>
                  </span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
