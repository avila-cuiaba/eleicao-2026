<!DOCTYPE html>
<html lang="pt-BR" class="entregas-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>entregas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-entregas">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap">
      <div class="card-body py-3">
        <div class="row g-3 align-items-start">
          <div class="col-12 col-lg-5 entregas-filtro-wrap">
            <div class="small text-secondary mb-2">região</div>
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
          </div>
          <div class="col-12 col-lg-7 d-none" id="municipiosWrap">
            <div class="accordion entregas-municipios-accordion" id="accordionMunicipios">
              <div class="accordion-item border-0 shadow-sm">
                <h2 class="accordion-header" id="headingMunicipios">
                  <button
                    type="button"
                    class="accordion-button collapsed entregas-municipios-accordion-btn py-2"
                    id="btnAccordionMunicipios"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapseMunicipios"
                    aria-expanded="false"
                    aria-controls="collapseMunicipios"
                  >
                    <span id="municipioAccordionTitulo" class="entregas-municipio-accordion-titulo">município</span>
                  </button>
                </h2>
                <div
                  id="collapseMunicipios"
                  class="accordion-collapse collapse"
                  aria-labelledby="headingMunicipios"
                  data-bs-parent="#accordionMunicipios"
                >
                  <div class="accordion-body py-2 px-2">
                    <div id="filtroMunicipios" class="entregas-filtro-municipios" role="radiogroup" aria-label="Selecionar município"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="entregasKpis" class="row g-2 mt-3 d-none">
          <div class="col-6 col-sm-4 col-lg-3">
            <div class="card h-100 shadow-sm border-0 dashboard-kpi-card entregas-kpi-card entregas-kpi-card-qtd">
              <div class="card-body entregas-kpi-body">
                <div class="dashboard-kpi-rotulo">entregas</div>
                <div class="entregas-kpi-ilustra entregas-kpi-ilustra-qtd" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                    <path d="M16.5 9.4 7.55 4.24"/>
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <path d="M3.27 6.96 12 12.01 20.73 6.96M12 22.08V12"/>
                  </svg>
                </div>
                <strong id="kpiEntregas" class="dashboard-kpi-valor">—</strong>
              </div>
            </div>
          </div>
          <div class="col-6 col-sm-4 col-lg-3">
            <div class="card h-100 shadow-sm border-0 dashboard-kpi-card entregas-kpi-card entregas-kpi-card-valor">
              <div class="card-body entregas-kpi-body">
                <div class="dashboard-kpi-rotulo">valor total</div>
                <div class="entregas-kpi-ilustra entregas-kpi-ilustra-valor" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                  </svg>
                </div>
                <strong id="kpiValorTotal" class="dashboard-kpi-valor">—</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p id="entregasSelecione" class="text-secondary small mb-3">
      selecione uma região e um município para ver as entregas.
    </p>

    <div id="entregasDadosCard" class="card shadow-sm border-0 mb-3 entregas-dados-card d-none">
      <div class="card-header bg-white border-bottom-0 pt-3 px-3 pb-0">
        <ul class="nav nav-tabs entregas-dados-tabs" id="entregasDadosTabs" role="tablist">
          <li class="nav-item" role="presentation" id="tabPorAnoItem">
            <button
              class="nav-link active"
              id="tabPorAno"
              data-bs-toggle="tab"
              data-bs-target="#painelPorAno"
              type="button"
              role="tab"
              aria-controls="painelPorAno"
              aria-selected="true"
            >
              por ano
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link"
              id="tabEntregas"
              data-bs-toggle="tab"
              data-bs-target="#painelEntregas"
              type="button"
              role="tab"
              aria-controls="painelEntregas"
              aria-selected="false"
            >
              entregas
            </button>
          </li>
        </ul>
      </div>
      <div class="card-body p-0">
        <div class="tab-content" id="entregasDadosTabContent">
          <div class="tab-pane fade show active" id="painelPorAno" role="tabpanel" aria-labelledby="tabPorAno" tabindex="0">
            <div class="table-responsive">
              <table class="table table-sm table-hover mb-0 entregas-por-ano-tabela">
                <thead class="table-light">
                  <tr>
                    <th scope="col">ano</th>
                    <th scope="col" class="text-end">valor</th>
                  </tr>
                </thead>
                <tbody id="entregasPorAnoCorpo"></tbody>
              </table>
            </div>
          </div>
          <div class="tab-pane fade" id="painelEntregas" role="tabpanel" aria-labelledby="tabEntregas" tabindex="0">
            <div class="table-responsive">
              <table class="table table-hover table-sm mb-0 crud-tabela entregas-tabela">
                <thead class="table-light">
                  <tr id="cabecalhoDesktop" class="entregas-thead-desktop"></tr>
                  <tr id="cabecalhoMobile" class="entregas-thead-mobile"></tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
              </table>
            </div>
            <p id="vazio" class="text-secondary small text-center py-4 mb-0" hidden>nenhum registro encontrado.</p>
          </div>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/planilha-api.js"></script>
  <script src="../js/entregas.js"></script>
</body>
</html>
