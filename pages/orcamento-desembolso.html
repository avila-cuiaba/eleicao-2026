<!DOCTYPE html>
<html lang="pt-BR" class="orcamento-desembolso-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento — desembolso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-orcamento-desembolso">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="row g-2 g-sm-3 mb-3 orcamento-desembolso-topo orcamento-desembolso-kpi-row">
      <div class="col-6 col-lg orcamento-desembolso-kpi-mobile-oculto">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-jul30">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo orcamento-desembolso-kpi-rotulo-data">30 Jul</div>
            <strong id="kpiJul30" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-ago15">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo orcamento-desembolso-kpi-rotulo-data">15 Ago</div>
            <strong id="kpiAgo15" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-ago30">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo orcamento-desembolso-kpi-rotulo-data">30 Ago</div>
            <strong id="kpiAgo30" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-set15">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo orcamento-desembolso-kpi-rotulo-data">15 Set</div>
            <strong id="kpiSet15" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-set30">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo orcamento-desembolso-kpi-rotulo-data">30 Set</div>
            <strong id="kpiSet30" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card orcamento-desembolso-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 orcamento-desembolso-tabela">
            <colgroup>
              <col class="orcamento-desembolso-col-item orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-orcamento orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-stack-item orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-a orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-b orcamento-tabela-stack-col" />
            </colgroup>
            <thead>
              <tr>
                <th rowspan="2" scope="col" class="orcamento-desembolso-col-item orcamento-tabela-desktop-col">item despesa</th>
                <th rowspan="2" scope="col" class="text-end orcamento-desembolso-col-orcamento orcamento-tabela-desktop-col">orçamento</th>
                <th colspan="5" scope="colgroup" class="text-center orcamento-desembolso-th-desembolso orcamento-tabela-desktop-col">desembolso</th>
                <th rowspan="2" scope="col" class="orcamento-desembolso-col-stack-item orcamento-tabela-stack-col">
                  <div class="orcamento-desembolso-th-stack-head" aria-hidden="true">
                    <span>item despesa</span>
                    <span>orçamento</span>
                  </div>
                </th>
                <th colspan="2" scope="colgroup" class="text-center orcamento-desembolso-th-desembolso orcamento-tabela-stack-col">desembolso</th>
              </tr>
              <tr>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-desembolso-th-data orcamento-tabela-desktop-col">30 Jul</th>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-desembolso-th-data orcamento-tabela-desktop-col">15 Ago</th>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-desembolso-th-data orcamento-tabela-desktop-col">30 Ago</th>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-desembolso-th-data orcamento-tabela-desktop-col">15 Set</th>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-desembolso-th-data orcamento-tabela-desktop-col">30 Set</th>
                <th scope="col" class="text-end orcamento-desembolso-col-stack-prazo-a orcamento-tabela-stack-col">
                  <div class="orcamento-tabela-stack-head" aria-hidden="true">
                    <span class="orcamento-desembolso-th-data">30 Jul/15 Ago</span>
                    <span class="orcamento-desembolso-th-data">15 Set</span>
                  </div>
                </th>
                <th scope="col" class="text-end orcamento-desembolso-col-stack-prazo-b orcamento-tabela-stack-col">
                  <div class="orcamento-tabela-stack-head" aria-hidden="true">
                    <span class="orcamento-desembolso-th-data">30 Ago</span>
                    <span class="orcamento-desembolso-th-data">30 Set</span>
                  </div>
                </th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 orcamento-desembolso-tabela">
            <colgroup>
              <col class="orcamento-desembolso-col-item orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-orcamento orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-stack-item orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-a orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-b orcamento-tabela-stack-col" />
            </colgroup>
            <tbody id="corpoDesembolso">
              <tr>
                <td colspan="10" class="text-center text-secondary py-4">carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/orcamento-desembolso.js"></script>
</body>
</html>
