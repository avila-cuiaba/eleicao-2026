<!DOCTYPE html>
<html lang="pt-BR" class="orcamento-desembolso-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento — desembolso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-orcamento-desembolso">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="row g-2 g-sm-3 mb-3 orcamento-desembolso-topo">
      <div class="col-6 col-lg-3">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-5">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo">5 dias</div>
            <strong id="kpi5" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-15">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo">15 dias</div>
            <strong id="kpi15" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-30">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo">30 dias</div>
            <strong id="kpi30" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-desembolso-kpi-card orcamento-desembolso-kpi-45">
          <div class="card-body orcamento-desembolso-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo">45 dias</div>
            <strong id="kpi45" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card orcamento-desembolso-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 orcamento-desembolso-tabela">
            <colgroup>
              <col class="orcamento-desembolso-col-item orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-orcamento orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-stack-item orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-a orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-b orcamento-tabela-stack-col" />
            </colgroup>
            <thead>
              <tr>
                <th rowspan="2" scope="col" class="orcamento-desembolso-col-item orcamento-tabela-desktop-col">item despesa</th>
                <th rowspan="2" scope="col" class="text-end orcamento-desembolso-col-orcamento orcamento-tabela-desktop-col">orçamento</th>
                <th colspan="4" scope="colgroup" class="text-center orcamento-desembolso-th-desembolso orcamento-tabela-desktop-col">desembolso</th>
                <th rowspan="2" scope="col" class="orcamento-desembolso-col-stack-item orcamento-tabela-stack-col">
                  <div class="orcamento-desembolso-th-stack-head" aria-hidden="true">
                    <span>item despesa</span>
                    <span>orçamento</span>
                  </div>
                </th>
                <th colspan="2" scope="colgroup" class="text-center orcamento-desembolso-th-desembolso orcamento-tabela-stack-col">desembolso</th>
              </tr>
              <tr>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-tabela-desktop-col">5 dias</th>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-tabela-desktop-col">15 dias</th>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-tabela-desktop-col">30 dias</th>
                <th scope="col" class="text-end orcamento-desembolso-col-prazo orcamento-tabela-desktop-col">45 dias</th>
                <th scope="col" class="text-end orcamento-desembolso-col-stack-prazo-a orcamento-tabela-stack-col">
                  <div class="orcamento-tabela-stack-head" aria-hidden="true">
                    <span>5 dias</span>
                    <span>30 dias</span>
                  </div>
                </th>
                <th scope="col" class="text-end orcamento-desembolso-col-stack-prazo-b orcamento-tabela-stack-col">
                  <div class="orcamento-tabela-stack-head" aria-hidden="true">
                    <span>15 dias</span>
                    <span>45 dias</span>
                  </div>
                </th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 orcamento-desembolso-tabela">
            <colgroup>
              <col class="orcamento-desembolso-col-item orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-orcamento orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-prazo orcamento-tabela-desktop-col" />
              <col class="orcamento-desembolso-col-stack-item orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-a orcamento-tabela-stack-col" />
              <col class="orcamento-desembolso-col-stack-prazo-b orcamento-tabela-stack-col" />
            </colgroup>
            <tbody id="corpoDesembolso">
              <tr>
                <td colspan="9" class="text-center text-secondary py-4">carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/orcamento-desembolso.js"></script>
</body>
</html>
