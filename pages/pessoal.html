<!DOCTYPE html>
<html lang="pt-BR" class="pessoal-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pessoal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-pessoal">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <ul class="nav nav-tabs dashboard-sm-tabs d-xl-none" id="pageSmTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pageTabMarcadores" data-bs-toggle="tab" data-bs-target="#pagePainelMarcadores" type="button" role="tab" aria-controls="pagePainelMarcadores" aria-selected="true">marcadores</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pageTabRegistros" data-bs-toggle="tab" data-bs-target="#pagePainelRegistros" type="button" role="tab" aria-controls="pagePainelRegistros" aria-selected="false">registros</button>
      </li>
    </ul>

    <div class="tab-content dashboard-sm-layout" id="pageSmTabContent">
      <div class="tab-pane fade show active dashboard-sm-pane" id="pagePainelMarcadores" role="tabpanel" aria-labelledby="pageTabMarcadores" tabindex="0">
    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap">
      <div class="card-body py-3">
        <div class="row g-2 g-sm-3 align-items-start pessoal-micro-row">
          <div class="col-5 col-lg-4">
            <div class="pessoal-filtros-regiao-wrap">
              <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
              <label class="pessoal-filtro-visualizar-nulos form-check form-check-sm mb-0" for="visualizarRegistrosNulos">
                <input type="checkbox" class="form-check-input" id="visualizarRegistrosNulos" />
                <span class="form-check-label">visualizar registros nulos</span>
              </label>
            </div>
          </div>
          <div class="col-7 col-lg-8">
            <div class="pessoal-kpi-grid">
              <div class="pessoal-kpi-slot pessoal-kpi-slot--efetivo">
                <div class="card h-100 shadow-sm dashboard-kpi-card pessoal-kpi-card--principal">
                  <div class="card-body py-2 px-2 px-sm-3 text-center">
                    <div class="dashboard-kpi-rotulo">efetivo mobilizado</div>
                    <strong id="kpiEfetivoMobilizado" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--prefeito">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-prefeito">
                  <div class="card-body py-2 px-2 px-sm-3 text-center">
                    <div class="dashboard-kpi-rotulo">prefeito</div>
                    <strong id="kpiPrefeito" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--vereador">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-vereador">
                  <div class="card-body py-2 px-2 px-sm-3 text-center">
                    <div class="dashboard-kpi-rotulo">vereador</div>
                    <strong id="kpiVereador" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--municipios">
                <div class="card h-100 shadow-sm dashboard-kpi-card pessoal-kpi-card--destaque">
                  <div class="card-body py-2 px-2 px-sm-3 text-center">
                    <div class="dashboard-kpi-rotulo">municípios</div>
                    <strong id="kpiMunicipios" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--agente">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-agente">
                  <div class="card-body py-2 px-2 px-sm-3 text-center">
                    <div class="dashboard-kpi-rotulo">agente politico</div>
                    <strong id="kpiAgente" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--apoio">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-apoio">
                  <div class="card-body py-2 px-2 px-sm-3 text-center">
                    <div class="dashboard-kpi-rotulo">apoiadores</div>
                    <strong id="kpiApoiadores" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
      </div>

      <div class="tab-pane fade dashboard-sm-pane" id="pagePainelRegistros" role="tabpanel" aria-labelledby="pageTabRegistros" tabindex="0">
    <div class="card shadow-sm border-0 dashboard-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 pessoal-tabela">
            <colgroup>
              <col class="pessoal-col-municipio" />
              <col class="pessoal-col-prefeito" />
              <col class="pessoal-col-vereador" />
              <col class="pessoal-col-agente" />
              <col class="pessoal-col-apoiadores" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="pessoal-col-municipio">
                  <span class="dashboard-th-principal">município</span>
                </th>
                <th scope="col" class="text-end pessoal-col-prefeito pessoal-th-prefeito">prefeito</th>
                <th scope="col" class="text-end pessoal-col-vereador">vereador</th>
                <th scope="col" class="text-end pessoal-col-agente">
                  <span class="pessoal-th-label-sm">agente</span>
                  <span class="pessoal-th-label-lg">agente politico</span>
                </th>
                <th scope="col" class="text-end pessoal-col-apoiadores">apoiadores</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 pessoal-tabela">
            <colgroup>
              <col class="pessoal-col-municipio" />
              <col class="pessoal-col-prefeito" />
              <col class="pessoal-col-vereador" />
              <col class="pessoal-col-agente" />
              <col class="pessoal-col-apoiadores" />
            </colgroup>
            <tbody id="corpoTabela">
              <tr>
                <td colspan="5" class="text-center text-secondary py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorio.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/popover-tabela.js"></script>
  <script src="../js/pessoal.js"></script>
</body>
</html>
