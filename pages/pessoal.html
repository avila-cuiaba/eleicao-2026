<!DOCTYPE html>
<html lang="pt-BR" class="pessoal-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pessoal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-pessoal">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap">
      <div class="card-body py-3">
        <div class="row g-2 g-sm-3 align-items-start pessoal-micro-row">
          <div class="col-5 col-lg-4">
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
          </div>
          <div class="col-7 col-lg-8">
            <div class="pessoal-kpi-grid">
              <div class="pessoal-kpi-slot pessoal-kpi-slot--ideal">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card kpi-ideal">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">meta votação 🎯</div>
                    <strong id="kpiIdeal" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--prefeito pessoal-kpi-slot--lg">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-prefeito">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">prefeito</div>
                    <strong id="kpiPrefeito" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--vereador pessoal-kpi-slot--lg">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-vereador">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">vereador</div>
                    <strong id="kpiVereador" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--agente pessoal-kpi-slot--lg">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-agente">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">agente-político</div>
                    <strong id="kpiAgente" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--assessor pessoal-kpi-slot--lg">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-assessor">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">assessor</div>
                    <strong id="kpiAssessor" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--apoiadores pessoal-kpi-slot--lg">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-apoiadores">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">apoiadores</div>
                    <strong id="kpiApoiadores" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--soma-pv pessoal-kpi-slot--sm">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-soma-pv">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">prefeito + vereador</div>
                    <strong id="kpiSomaPrefeitoVereador" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--soma-aa pessoal-kpi-slot--sm">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-soma-aa">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">agente + assessor</div>
                    <strong id="kpiSomaAgenteAssessor" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="pessoal-kpi-slot pessoal-kpi-slot--apoiadores-sm pessoal-kpi-slot--sm">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card pessoal-kpi-apoiadores">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">apoiadores</div>
                    <strong id="kpiApoiadoresSm" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 pessoal-tabela">
            <colgroup>
              <col class="pessoal-col-municipio" />
              <col class="pessoal-col-ideal" />
              <col class="pessoal-col-prefeito" />
              <col class="pessoal-col-vereador" />
              <col class="pessoal-col-agente" />
              <col class="pessoal-col-assessor" />
              <col class="pessoal-col-apoiadores" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="pessoal-col-municipio pessoal-th-municipio-composto">
                  <span class="dashboard-th-principal">município</span>
                  <span class="dashboard-th-sub text-muted pessoal-th-sub-ideal">meta votação 🎯</span>
                </th>
                <th scope="col" class="text-end pessoal-col-ideal pessoal-col-lg-only">
                  <span class="pessoal-th-meta-titulo dashboard-th-badge dashboard-th-badge-ideal">meta votação 🎯</span>
                </th>
                <th scope="col" class="text-end pessoal-col-prefeito pessoal-th-prefeito">prefeito</th>
                <th scope="col" class="text-end pessoal-col-vereador">vereador</th>
                <th scope="col" class="text-end pessoal-col-agente">
                  <span class="pessoal-th-label-sm">agente</span>
                  <span class="pessoal-th-label-lg">agente-político</span>
                </th>
                <th scope="col" class="text-end pessoal-col-assessor pessoal-col-lg-only">assessor</th>
                <th scope="col" class="text-end pessoal-col-apoiadores">apoiadores</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 pessoal-tabela">
            <colgroup>
              <col class="pessoal-col-municipio" />
              <col class="pessoal-col-ideal" />
              <col class="pessoal-col-prefeito" />
              <col class="pessoal-col-vereador" />
              <col class="pessoal-col-agente" />
              <col class="pessoal-col-assessor" />
              <col class="pessoal-col-apoiadores" />
            </colgroup>
            <tbody id="corpoTabela">
              <tr>
                <td colspan="7" class="text-center text-secondary py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/pessoal.js"></script>
</body>
</html>
