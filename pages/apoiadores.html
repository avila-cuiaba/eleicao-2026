<!DOCTYPE html>
<html lang="pt-BR" class="apoiadores-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apoiadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://kit.fontawesome.com/905f5bcd47.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light page-frame-body page-apoiadores">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <ul class="nav nav-tabs dashboard-sm-tabs d-xl-none" id="pageSmTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pageTabMarcadores" data-bs-toggle="tab" data-bs-target="#pagePainelMarcadores" type="button" role="tab" aria-controls="pagePainelMarcadores" aria-selected="true">marcadores</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pageTabRegistros" data-bs-toggle="tab" data-bs-target="#pagePainelRegistros" type="button" role="tab" aria-controls="pagePainelRegistros" aria-selected="false">registros</button>
      </li>
    </ul>

    <div class="tab-content dashboard-sm-layout" id="pageSmTabContent">
      <div class="tab-pane fade show active dashboard-sm-pane" id="pagePainelMarcadores" role="tabpanel" aria-labelledby="pageTabMarcadores" tabindex="0">
    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap apoiadores-kpi-wrap">
      <div class="card-body py-3">
        <div class="row g-2 g-sm-3 align-items-start apoiadores-micro-row">
          <div class="col-5 col-lg-4">
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
          </div>
          <div class="col-7 col-lg-8">
            <div class="apoiadores-kpi-layout">
              <div class="apoiadores-kpi-painel">
                <div class="apoiadores-kpi-painel-linha">
                  <div class="apoiadores-kpi-slot apoiadores-kpi-slot--principal">
                    <div class="card h-100 shadow-sm dashboard-kpi-card apoiadores-kpi-card--principal">
                      <div class="card-body py-2 px-2 px-sm-3 text-center">
                        <div class="dashboard-kpi-rotulo">total apoiadores</div>
                        <strong id="kpiEfetivoMobilizado" class="dashboard-kpi-valor">—</strong>
                      </div>
                    </div>
                  </div>
                  <div class="apoiadores-kpi-slot">
                    <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-apoiador">
                      <div class="card-body py-2 px-2 px-sm-3 text-center">
                        <div class="dashboard-kpi-rotulo">lider</div>
                        <strong id="kpiLider" class="dashboard-kpi-valor">—</strong>
                      </div>
                    </div>
                  </div>
                  <div class="apoiadores-kpi-slot">
                    <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-apoiador">
                      <div class="card-body py-2 px-2 px-sm-3 text-center">
                        <div class="dashboard-kpi-rotulo">customizado</div>
                        <strong id="kpiCustom" class="dashboard-kpi-valor">—</strong>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="apoiadores-kpi-painel-linha">
                  <div class="apoiadores-kpi-slot apoiadores-kpi-slot--destaque">
                    <div class="card h-100 shadow-sm dashboard-kpi-card apoiadores-kpi-card--destaque">
                      <div class="card-body py-2 px-2 px-sm-3 text-center">
                        <div class="dashboard-kpi-rotulo">total de lideranças</div>
                        <strong id="kpiTotal" class="dashboard-kpi-valor">—</strong>
                      </div>
                    </div>
                  </div>
                  <div class="apoiadores-kpi-slot">
                    <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-apoiador">
                      <div class="card-body py-2 px-2 px-sm-3 text-center">
                        <div class="dashboard-kpi-rotulo">integral</div>
                        <strong id="kpiIntegral" class="dashboard-kpi-valor">—</strong>
                      </div>
                    </div>
                  </div>
                  <div class="apoiadores-kpi-slot">
                    <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-apoiador">
                      <div class="card-body py-2 px-2 px-sm-3 text-center">
                        <div class="dashboard-kpi-rotulo">meio</div>
                        <strong id="kpiMeio" class="dashboard-kpi-valor">—</strong>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
      </div>

      <div class="tab-pane fade dashboard-sm-pane" id="pagePainelRegistros" role="tabpanel" aria-labelledby="pageTabRegistros" tabindex="0">
    <div class="card shadow-sm border-0 dashboard-tabela-card apoiadores-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="apoiadores-tabela-toolbar apoiadores-th-ident-inner--master">
          <button type="button" class="agenda-btn-nova agenda-btn-nova--tabela d-none" id="btnIncluirApoiador" title="incluir" aria-label="incluir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 8v8M8 12h8" /></svg>
          </button>
          <label class="apoiadores-busca-campo" for="buscaLideranca">
            <span class="visually-hidden">buscar liderança</span>
            <span class="apoiadores-busca-inner">
              <span class="apoiadores-busca-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" />
                  <path d="M20 20l-3.5-3.5" />
                </svg>
              </span>
              <input
                type="search"
                id="buscaLideranca"
                class="form-control form-control-sm apoiadores-busca-input"
                placeholder="buscar"
                autocomplete="off"
              />
            </span>
          </label>
        </div>
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 apoiadores-tabela">
            <colgroup>
              <col class="apoiadores-col-ident" />
              <col class="apoiadores-col-municipio" />
              <col class="apoiadores-col-lider" />
              <col class="apoiadores-col-integral" />
              <col class="apoiadores-col-meio" />
              <col class="apoiadores-col-custom" />
            </colgroup>
            <thead>
              <tr class="apoiadores-thead-row1">
                <th scope="col" rowspan="2" class="apoiadores-col-ident apoiadores-th-ident dashboard-th-base">
                  <div class="apoiadores-th-ident-inner">
                    <span class="apoiadores-th-titulo apoiadores-th-desktop apoiadores-th-ordenavel">
                      <span class="apoiadores-th-ordenavel-rotulo">liderança</span>
                      <span class="apoiadores-th-sort" role="group" aria-label="ordenar por liderança">
                        <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="lideranca" data-ordenar-dir="asc" title="liderança A–Z" aria-label="liderança crescente">
                          <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 0 10 6H0z" /></svg>
                        </button>
                        <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="lideranca" data-ordenar-dir="desc" title="liderança Z–A" aria-label="liderança decrescente">
                          <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 6 0 0h10z" /></svg>
                        </button>
                      </span>
                    </span>
                    <span class="apoiadores-th-mobile">
                      <span class="apoiadores-th-mobile-linha apoiadores-th-ordenavel">
                        <span class="dashboard-th-principal">liderança</span>
                        <span class="apoiadores-th-sort" role="group" aria-label="ordenar por liderança">
                          <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="lideranca" data-ordenar-dir="asc" title="liderança A–Z" aria-label="liderança crescente">
                            <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 0 10 6H0z" /></svg>
                          </button>
                          <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="lideranca" data-ordenar-dir="desc" title="liderança Z–A" aria-label="liderança decrescente">
                            <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 6 0 0h10z" /></svg>
                          </button>
                        </span>
                      </span>
                      <span class="apoiadores-th-mobile-linha apoiadores-th-ordenavel">
                        <span class="dashboard-th-sub text-muted apoiadores-th-sub-municipio">município</span>
                        <span class="apoiadores-th-sort" role="group" aria-label="ordenar por município">
                          <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="municipio" data-ordenar-dir="asc" title="município A–Z" aria-label="município crescente">
                            <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 0 10 6H0z" /></svg>
                          </button>
                          <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="municipio" data-ordenar-dir="desc" title="município Z–A" aria-label="município decrescente">
                            <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 6 0 0h10z" /></svg>
                          </button>
                        </span>
                      </span>
                    </span>
                  </div>
                </th>
                <th scope="col" rowspan="2" class="apoiadores-col-municipio dashboard-th-base apoiadores-th-municipio">
                  <span class="apoiadores-th-desktop apoiadores-th-ordenavel">
                    <span class="apoiadores-th-ordenavel-rotulo">município</span>
                    <span class="apoiadores-th-sort" role="group" aria-label="ordenar por município">
                      <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="municipio" data-ordenar-dir="asc" title="município A–Z" aria-label="município crescente">
                        <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 0 10 6H0z" /></svg>
                      </button>
                      <button type="button" class="apoiadores-th-sort-btn" data-ordenar-col="municipio" data-ordenar-dir="desc" title="município Z–A" aria-label="município decrescente">
                        <svg class="apoiadores-th-sort-icone" viewBox="0 0 10 6" aria-hidden="true"><path fill="currentColor" d="M5 6 0 0h10z" /></svg>
                      </button>
                    </span>
                  </span>
                </th>
                <th scope="col" colspan="4" class="text-center dashboard-th-votacao apoiadores-th-grupo apoiadores-col-separador"><strong>apoiador</strong></th>
              </tr>
              <tr class="apoiadores-thead-cols apoiadores-th-apoiador-desk">
                <th scope="col" class="text-end apoiadores-col-lider apoiadores-col-separador">lider</th>
                <th scope="col" class="text-end apoiadores-col-integral">integral</th>
                <th scope="col" class="text-end apoiadores-col-meio">meio</th>
                <th scope="col" class="text-end apoiadores-col-custom">customizado</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 apoiadores-tabela">
            <colgroup>
              <col class="apoiadores-col-ident" />
              <col class="apoiadores-col-municipio" />
              <col class="apoiadores-col-lider" />
              <col class="apoiadores-col-integral" />
              <col class="apoiadores-col-meio" />
              <col class="apoiadores-col-custom" />
            </colgroup>
            <tbody id="corpoApoiadores">
              <tr>
                <td colspan="6" class="text-center text-secondary py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p id="vazio" class="text-secondary text-center py-4 mb-0" hidden>
          Nenhum apoiador encontrado.
        </p>
      </div>
    </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <div class="modal fade master-crud-modal" id="modalApoiadorCrud" tabindex="-1" aria-labelledby="modalApoiadorTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalApoiadorTitulo">apoiador</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="fechar"></button>
        </div>
        <div class="modal-body">
          <form id="formApoiadorCrud" class="row g-3">
            <div class="col-12">
              <span class="form-label d-block" id="campoApClassificacaoRotulo">classificação da liderança</span>
              <input type="hidden" id="campoApClassificacao" value="0" />
              <div class="apoiadores-classificacao-linha">
                <div id="campoApClassificacaoEstrelas" class="apoiadores-rating" role="group" aria-labelledby="campoApClassificacaoRotulo"></div>
                <div class="form-check apoiadores-check-usar-classificacao mb-0">
                  <input class="form-check-input" type="checkbox" id="chkApUsarClassificacao" checked />
                  <label class="form-check-label" for="chkApUsarClassificacao">usar classificação da liderança</label>
                </div>
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="campoApLideranca">liderança</label>
              <input type="text" class="form-control form-control-sm" id="campoApLideranca" required />
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="campoApMunicipio">município</label>
              <select class="form-select form-select-sm" id="campoApMunicipio" required>
                <option value="">selecione</option>
              </select>
            </div>
            <div class="col-12" id="rowApFechadoOrcamento" hidden>
              <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" id="chkApFechadoOrcamento" />
                <label class="form-check-label" for="chkApFechadoOrcamento">fechado orçamento</label>
              </div>
            </div>
            <div class="col-4">
              <label class="form-label" for="campoApProprioValor">proprio apoiador (valor)</label>
              <input type="text" class="form-control form-control-sm master-crud-modal-fin" id="campoApProprioValor" data-moeda-apoiador inputmode="decimal" placeholder="R$ 0,00" aria-label="valor proprio apoiador" />
            </div>
            <div class="col-12">
              <label class="form-label d-block" for="campoApCustom">apoiador customizado</label>
              <div class="row g-2 master-crud-modal-par">
                <div class="col-4">
                  <input type="number" class="form-control form-control-sm master-crud-input-num" id="campoApCustom" min="0" step="1" inputmode="numeric" aria-label="quantidade apoiador customizado" />
                </div>
                <div class="col-4">
                  <input type="text" class="form-control form-control-sm master-crud-modal-fin" id="campoApFinCustom" data-moeda-apoiador inputmode="decimal" placeholder="R$ 0,00" aria-label="valor financeiro apoiador customizado" />
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="row g-2 align-items-end apoiadores-modal-linha-tres-apoiadores">
                <div class="col-4">
                  <label class="form-label d-block" for="campoApLider">apoiador lider</label>
                  <input type="number" class="form-control form-control-sm master-crud-input-num" id="campoApLider" min="0" step="1" inputmode="numeric" aria-label="quantidade apoiador lider" />
                  <input type="text" class="form-control form-control-sm master-crud-modal-fin d-none" id="campoApFinLider" inputmode="decimal" tabindex="-1" aria-hidden="true" />
                </div>
                <div class="col-4">
                  <label class="form-label d-block" for="campoApIntegral">apoiador integral</label>
                  <input type="number" class="form-control form-control-sm master-crud-input-num" id="campoApIntegral" min="0" step="1" inputmode="numeric" aria-label="quantidade apoiador integral" />
                  <input type="text" class="form-control form-control-sm master-crud-modal-fin d-none" id="campoApFinIntegral" inputmode="decimal" tabindex="-1" aria-hidden="true" />
                </div>
                <div class="col-4">
                  <label class="form-label d-block" for="campoApMeio">apoiador meio</label>
                  <input type="number" class="form-control form-control-sm master-crud-input-num" id="campoApMeio" min="0" step="1" inputmode="numeric" aria-label="quantidade apoiador meio" />
                  <input type="text" class="form-control form-control-sm master-crud-modal-fin d-none" id="campoApFinMeio" inputmode="decimal" tabindex="-1" aria-hidden="true" />
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">cancelar</button>
          <button type="button" class="btn btn-sm btn-primary" id="btnSalvarApoiador">salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorio.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/app-confirm.js"></script>
  <script src="../js/planilha-api.js"></script>
  <script src="../js/master-crud.js"></script>
  <script src="../js/popover-tabela.js"></script>
  <script src="../js/busca-tabela.js"></script>
  <script src="../js/apoiadores.js"></script>
</body>
</html>
