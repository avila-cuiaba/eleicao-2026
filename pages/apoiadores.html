<!DOCTYPE html>
<html lang="pt-BR" class="apoiadores-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apoiadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-apoiadores">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap apoiadores-kpi-wrap">
      <div class="card-body py-3">
        <div class="row g-2 g-sm-3 align-items-start apoiadores-micro-row">
          <div class="col-5 col-lg-4">
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por micro-região"></div>
          </div>
          <div class="col-7 col-lg-8">
            <div class="apoiadores-kpi-grid">
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-total">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">total</div>
                    <strong id="kpiTotal" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-lider">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">lider</div>
                    <strong id="kpiLider" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-30">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">30 dias</div>
                    <strong id="kpi30" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-45">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">45 dias</div>
                    <strong id="kpi45" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-custom">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">customizado</div>
                    <strong id="kpiCustom" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card apoiadores-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 apoiadores-tabela">
            <colgroup>
              <col class="apoiadores-col-ident" />
              <col class="apoiadores-col-municipio" />
              <col class="apoiadores-col-lider" />
              <col class="apoiadores-col-30" />
              <col class="apoiadores-col-45" />
              <col class="apoiadores-col-custom" />
            </colgroup>
            <thead>
              <tr class="apoiadores-thead-row1">
                <th scope="col" rowspan="2" class="apoiadores-col-ident apoiadores-th-ident dashboard-th-base">
                  <div class="apoiadores-th-ident-inner">
                    <span class="apoiadores-th-titulo apoiadores-th-desktop">liderança</span>
                    <span class="apoiadores-th-mobile">
                      <span class="dashboard-th-principal">liderança</span>
                      <span class="dashboard-th-sub text-muted apoiadores-th-sub-municipio">município</span>
                    </span>
                    <label class="apoiadores-busca-campo" for="buscaLideranca">
                      <span class="visually-hidden">buscar liderança</span>
                      <span class="apoiadores-busca-inner">
                        <span class="apoiadores-busca-icone" aria-hidden="true">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M20 20l-3.5-3.5" />
                          </svg>
                        </span>
                        <input
                          type="search"
                          id="buscaLideranca"
                          class="form-control form-control-sm apoiadores-busca-input"
                          placeholder="liderança"
                          autocomplete="off"
                        />
                      </span>
                    </label>
                  </div>
                </th>
                <th scope="col" rowspan="2" class="apoiadores-col-municipio dashboard-th-base apoiadores-th-municipio">
                  <span class="apoiadores-th-desktop">município</span>
                </th>
                <th scope="col" colspan="4" class="text-center dashboard-th-votacao apoiadores-th-grupo apoiadores-col-separador"><strong>apoiador</strong></th>
              </tr>
              <tr class="apoiadores-thead-cols">
                <th scope="col" class="text-end apoiadores-col-lider apoiadores-col-separador">lider</th>
                <th scope="col" class="text-end apoiadores-col-30">30 dias</th>
                <th scope="col" class="text-end apoiadores-col-45">45 dias</th>
                <th scope="col" class="text-end apoiadores-col-custom">customizado</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 apoiadores-tabela">
            <colgroup>
              <col class="apoiadores-col-ident" />
              <col class="apoiadores-col-municipio" />
              <col class="apoiadores-col-lider" />
              <col class="apoiadores-col-30" />
              <col class="apoiadores-col-45" />
              <col class="apoiadores-col-custom" />
            </colgroup>
            <tbody id="corpoApoiadores">
              <tr>
                <td colspan="6" class="text-center text-secondary py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p id="vazio" class="text-secondary text-center py-4 mb-0" hidden>
          Nenhum apoiador encontrado.
        </p>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/apoiadores.js"></script>
</body>
</html>
