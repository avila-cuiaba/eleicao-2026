<!DOCTYPE html>
<html lang="pt-BR" class="parcerias-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parcerias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-parcerias page-apoiadores">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <ul class="nav nav-tabs dashboard-sm-tabs d-xl-none" id="pageSmTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pageTabMarcadores" data-bs-toggle="tab" data-bs-target="#pagePainelMarcadores" type="button" role="tab" aria-controls="pagePainelMarcadores" aria-selected="true">marcadores</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pageTabRegistros" data-bs-toggle="tab" data-bs-target="#pagePainelRegistros" type="button" role="tab" aria-controls="pagePainelRegistros" aria-selected="false">registros</button>
      </li>
    </ul>

    <div class="tab-content dashboard-sm-layout" id="pageSmTabContent">
      <div class="tab-pane fade show active dashboard-sm-pane" id="pagePainelMarcadores" role="tabpanel" aria-labelledby="pageTabMarcadores" tabindex="0">
    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap apoiadores-kpi-wrap">
      <div class="card-body py-3">
        <div class="row g-2 g-sm-3 align-items-start apoiadores-micro-row">
          <div class="col-5 col-lg-4">
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
          </div>
          <div class="col-7 col-lg-8">
            <div class="apoiadores-kpi-grid parcerias-kpi-grid">
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-total">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">parcerias</div>
                    <strong id="kpiParcerias" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-lider">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">municípios</div>
                    <strong id="kpiMunicipios" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-30">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">apoiadores</div>
                    <strong id="kpiApoiadores" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="apoiadores-kpi-slot">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card apoiadores-kpi-custom">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">orçamento</div>
                    <strong id="kpiOrcamento" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
      </div>

      <div class="tab-pane fade dashboard-sm-pane" id="pagePainelRegistros" role="tabpanel" aria-labelledby="pageTabRegistros" tabindex="0">
    <div class="card shadow-sm border-0 dashboard-tabela-card apoiadores-tabela-card parcerias-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="apoiadores-tabela-toolbar">
          <label class="apoiadores-busca-campo" for="buscaParceria">
            <span class="visually-hidden">buscar parceria</span>
            <span class="apoiadores-busca-inner">
              <span class="apoiadores-busca-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" />
                  <path d="M20 20l-3.5-3.5" />
                </svg>
              </span>
              <input
                type="search"
                id="buscaParceria"
                class="form-control form-control-sm apoiadores-busca-input"
                          placeholder="buscar"
                autocomplete="off"
              />
            </span>
          </label>
        </div>
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 apoiadores-tabela parcerias-tabela">
            <colgroup>
              <col class="apoiadores-col-ident" />
              <col class="apoiadores-col-municipio" />
              <col class="apoiadores-col-lider" />
              <col class="apoiadores-col-30" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="apoiadores-col-ident apoiadores-th-ident dashboard-th-base">
                  <div class="apoiadores-th-ident-inner">
                    <span class="apoiadores-th-titulo apoiadores-th-desktop">parceria</span>
                    <span class="apoiadores-th-mobile">
                      <span class="dashboard-th-principal">parceria</span>
                      <span class="dashboard-th-sub text-muted apoiadores-th-sub-municipio">município</span>
                    </span>
                  </div>
                </th>
                <th scope="col" class="apoiadores-col-municipio dashboard-th-base apoiadores-th-municipio">
                  <span class="apoiadores-th-desktop">município</span>
                </th>
                <th scope="col" class="text-end apoiadores-col-lider">apoiadores</th>
                <th scope="col" class="text-end apoiadores-col-30">valor parceria</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 apoiadores-tabela parcerias-tabela">
            <colgroup>
              <col class="apoiadores-col-ident" />
              <col class="apoiadores-col-municipio" />
              <col class="apoiadores-col-lider" />
              <col class="apoiadores-col-30" />
            </colgroup>
            <tbody id="corpoParcerias">
              <tr>
                <td colspan="4" class="text-center text-secondary py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p id="vazio" class="text-secondary text-center py-4 mb-0" hidden>
          Nenhuma parceria encontrada.
        </p>
      </div>
    </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorio.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/tabela-ordenacao.js"></script>
  <script src="../js/busca-tabela.js"></script>
  <script src="../js/parcerias.js"></script>
</body>
</html>
