<!DOCTYPE html>
<html lang="pt-BR" class="dashboard-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>votação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-dashboard">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <ul class="nav nav-tabs dashboard-sm-tabs d-lg-none" id="pageSmTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pageTabMarcadores" data-bs-toggle="tab" data-bs-target="#pagePainelMarcadores" type="button" role="tab" aria-controls="pagePainelMarcadores" aria-selected="true">marcadores</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pageTabRegistros" data-bs-toggle="tab" data-bs-target="#pagePainelRegistros" type="button" role="tab" aria-controls="pagePainelRegistros" aria-selected="false">registros</button>
      </li>
    </ul>

    <div class="tab-content dashboard-sm-layout" id="pageSmTabContent">
      <div class="tab-pane fade show active dashboard-sm-pane" id="pagePainelMarcadores" role="tabpanel" aria-labelledby="pageTabMarcadores" tabindex="0">
    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap">
      <div class="card-body py-3">
        <div class="row g-2 g-sm-3 align-items-start dashboard-micro-row">
          <div class="col-5 col-lg-4">
            <div class="dashboard-filtros-regiao-wrap">
              <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
              <label class="dashboard-filtro-visualizar-nulos form-check form-check-sm mb-0" for="visualizarRegistrosNulos">
                <input type="checkbox" class="form-check-input" id="visualizarRegistrosNulos" />
                <span class="form-check-label">visualizar registros nulos</span>
              </label>
            </div>
          </div>
          <div class="col-7 col-lg-8">
            <div class="row g-2 dashboard-resumo-kpis">
              <div class="col-5 col-lg-4 order-1 order-lg-1 dashboard-kpi-cell dashboard-kpi-municipios">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">municípios</div>
                    <strong id="kpiMunicipios" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="col-7 col-lg-4 order-2 order-lg-2 dashboard-kpi-cell dashboard-kpi-populacao">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">população</div>
                    <strong id="kpiPopulacao" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="col-7 col-lg-4 order-3 order-lg-3 dashboard-kpi-cell dashboard-kpi-eleitores">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">eleitores</div>
                    <strong id="kpiEleitores" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="dashboard-kpi-votacao-titulo dashboard-kpi-cell d-lg-none order-4">
                <span class="dashboard-kpi-votacao-badge">votação</span>
              </div>
              <div class="col-6 col-lg-6 order-5 order-lg-4 dashboard-kpi-cell dashboard-kpi-minima">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card kpi-minima">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">
                      <span class="d-lg-none">mínima</span>
                      <span class="d-none d-lg-inline">votação mínima</span>
                    </div>
                    <strong id="kpiMinima" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="col-6 col-lg-6 order-6 order-lg-5 dashboard-kpi-cell dashboard-kpi-ideal">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card kpi-ideal">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">meta votação</div>
                    <strong id="kpiIdeal" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
      </div>

      <div class="tab-pane fade dashboard-sm-pane" id="pagePainelRegistros" role="tabpanel" aria-labelledby="pageTabRegistros" tabindex="0">
    <div class="card shadow-sm border-0 dashboard-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 dashboard-tabela">
            <colgroup>
              <col class="dashboard-col-municipio" />
              <col class="dashboard-col-eleitores" />
              <col class="dashboard-col-2022" />
              <col class="dashboard-col-minima" />
              <col class="dashboard-col-ideal" />
            </colgroup>
            <thead>
              <tr class="dashboard-thead-row1">
                <th scope="col" rowspan="2" class="dashboard-col-municipio dashboard-th-municipio-composto dashboard-th-base">
                  <span class="dashboard-th-principal">município</span>
                  <span class="dashboard-th-sub text-muted dashboard-th-sub-eleitores">eleitores</span>
                </th>
                <th scope="col" rowspan="2" class="text-end dashboard-col-eleitores dashboard-th-desktop-only dashboard-th-base">eleitores</th>
                <th scope="col" colspan="3" class="text-center dashboard-th-votacao"><strong>votação</strong></th>
              </tr>
              <tr class="dashboard-thead-row2">
                <th scope="col" class="text-end dashboard-col-2022 dashboard-th-2022">2022</th>
                <th scope="col" class="text-end dashboard-col-minima dashboard-th-minima">mínima</th>
                <th scope="col" class="text-end dashboard-col-ideal dashboard-th-ideal">meta votação</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 dashboard-tabela">
            <colgroup>
              <col class="dashboard-col-municipio" />
              <col class="dashboard-col-eleitores" />
              <col class="dashboard-col-2022" />
              <col class="dashboard-col-minima" />
              <col class="dashboard-col-ideal" />
            </colgroup>
            <tbody id="corpoTabela">
              <tr>
                <td colspan="5" class="text-center text-secondary py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <div class="modal fade master-crud-modal" id="modalDashboardCrud" tabindex="-1" aria-labelledby="modalDashboardTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalDashboardTitulo">editar município</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="fechar"></button>
        </div>
        <div class="modal-body">
          <form id="formDashboardCrud" class="row g-3">
            <div class="col-12 col-sm-6">
              <label class="form-label" for="campoDashMunicipio">município</label>
              <input type="text" class="form-control form-control-sm" id="campoDashMunicipio" disabled />
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="campoDashRegiao">região</label>
              <input type="text" class="form-control form-control-sm" id="campoDashRegiao" disabled />
            </div>
            <div class="col-12">
              <div class="row g-2">
                <div class="col-4">
                  <label class="form-label" for="campoDashPopulacao">população</label>
                  <input type="text" class="form-control form-control-sm" id="campoDashPopulacao" disabled />
                </div>
                <div class="col-4">
                  <label class="form-label" for="campoDashEleitores">eleitores</label>
                  <input type="text" class="form-control form-control-sm" id="campoDashEleitores" disabled />
                </div>
                <div class="col-4">
                  <label class="form-label" for="campoDash2022">votos 2022</label>
                  <input type="text" class="form-control form-control-sm" id="campoDash2022" disabled />
                </div>
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="campoDashMinima">votação mínima</label>
              <input type="text" class="form-control form-control-sm" id="campoDashMinima" inputmode="numeric" />
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="campoDashIdeal">meta votação</label>
              <input type="text" class="form-control form-control-sm" id="campoDashIdeal" inputmode="numeric" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">cancelar</button>
          <button type="button" class="btn btn-sm btn-primary" id="btnSalvarDashboard">salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorio.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/app-confirm.js"></script>
  <script src="../js/planilha-api.js"></script>
  <script src="../js/master-crud.js"></script>
  <script src="../js/popover-tabela.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
