<!DOCTYPE html>
<html lang="pt-BR" class="dashboard-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeções</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-dashboard">
  <div class="page-frame-content">
    <div class="dashboard-topo d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
      <div>
        <h1 class="h4 mb-0">projeção de votação</h1>
      </div>
      <button type="button" id="btnAtualizar" class="btn-icone-atualizar" aria-label="Atualizar" title="atualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </div>

    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap">
      <div class="card-body py-3">
        <div class="row g-2 g-sm-3 align-items-start dashboard-micro-row">
          <div class="col-5 col-lg-4">
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por micro-região"></div>
          </div>
          <div class="col-7 col-lg-8">
            <div class="row g-2 dashboard-resumo-kpis">
              <div class="col-5 col-lg-4 order-1 order-lg-1 dashboard-kpi-cell dashboard-kpi-municipios">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">municípios</div>
                    <strong id="kpiMunicipios" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="col-7 col-lg-4 order-2 order-lg-2 dashboard-kpi-cell dashboard-kpi-populacao">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">população</div>
                    <strong id="kpiPopulacao" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="col-7 col-lg-4 order-3 order-lg-3 dashboard-kpi-cell dashboard-kpi-eleitores">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">eleitores</div>
                    <strong id="kpiEleitores" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="dashboard-kpi-votacao-titulo dashboard-kpi-cell d-lg-none order-4">
                <span class="dashboard-kpi-votacao-badge">votação</span>
              </div>
              <div class="col-6 col-lg-6 order-5 order-lg-4 dashboard-kpi-cell dashboard-kpi-minima">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card kpi-minima">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">
                      <span class="d-lg-none">mínima</span>
                      <span class="d-none d-lg-inline">votação mínima</span>
                    </div>
                    <strong id="kpiMinima" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
              <div class="col-6 col-lg-6 order-6 order-lg-5 dashboard-kpi-cell dashboard-kpi-ideal">
                <div class="card h-100 shadow-sm border-0 dashboard-kpi-card kpi-ideal">
                  <div class="card-body py-2 px-2 px-sm-3">
                    <div class="dashboard-kpi-rotulo">
                      <span class="d-lg-none">ideal</span>
                      <span class="d-none d-lg-inline">votação ideal</span>
                    </div>
                    <strong id="kpiIdeal" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 dashboard-tabela">
            <colgroup>
              <col class="dashboard-col-municipio" />
              <col class="dashboard-col-eleitores" />
              <col class="dashboard-col-2022" />
              <col class="dashboard-col-minima" />
              <col class="dashboard-col-ideal" />
            </colgroup>
            <thead>
              <tr class="dashboard-thead-row1">
                <th scope="col" rowspan="2" class="dashboard-col-municipio dashboard-th-municipio-composto dashboard-th-base">
                  <span class="dashboard-th-principal">município</span>
                  <span class="dashboard-th-sub text-muted dashboard-th-sub-eleitores">eleitores</span>
                </th>
                <th scope="col" rowspan="2" class="text-end dashboard-col-eleitores dashboard-th-desktop-only dashboard-th-base">eleitores</th>
                <th scope="col" colspan="3" class="text-center dashboard-th-votacao"><strong>votação</strong></th>
              </tr>
              <tr class="dashboard-thead-row2">
                <th scope="col" class="dashboard-col-2022 dashboard-th-2022 dashboard-th-col-composto">
                  <span class="dashboard-th-col-stack">
                    <span class="dashboard-th-col-rotulo">2022</span>
                    <span id="thTotal2022" class="dashboard-th-col-total dashboard-th-badge dashboard-th-badge-2022">—</span>
                  </span>
                </th>
                <th scope="col" class="dashboard-col-minima dashboard-th-minima dashboard-th-col-composto">
                  <span class="dashboard-th-col-stack">
                    <span class="dashboard-th-col-rotulo">mínima</span>
                    <span id="thTotalMinima" class="dashboard-th-col-total dashboard-th-badge dashboard-th-badge-minima">—</span>
                  </span>
                </th>
                <th scope="col" class="dashboard-col-ideal dashboard-th-ideal dashboard-th-col-composto">
                  <span class="dashboard-th-col-stack">
                    <span class="dashboard-th-col-rotulo">ideal</span>
                    <span id="thTotalIdeal" class="dashboard-th-col-total dashboard-th-badge dashboard-th-badge-ideal">—</span>
                  </span>
                </th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 dashboard-tabela">
            <colgroup>
              <col class="dashboard-col-municipio" />
              <col class="dashboard-col-eleitores" />
              <col class="dashboard-col-2022" />
              <col class="dashboard-col-minima" />
              <col class="dashboard-col-ideal" />
            </colgroup>
            <tbody id="corpoTabela">
              <tr>
                <td colspan="5" class="text-center text-secondary py-4">Carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
