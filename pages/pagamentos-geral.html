<!DOCTYPE html>
<html lang="pt-BR" class="orcamento-geral-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamentos — geral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-orcamento-geral page-pagamentos-geral">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <ul class="nav nav-tabs dashboard-sm-tabs d-xl-none" id="pageSmTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pageTabMarcadores" data-bs-toggle="tab" data-bs-target="#pagePainelMarcadores" type="button" role="tab" aria-controls="pagePainelMarcadores" aria-selected="true">marcadores</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pageTabRegistros" data-bs-toggle="tab" data-bs-target="#pagePainelRegistros" type="button" role="tab" aria-controls="pagePainelRegistros" aria-selected="false">registros</button>
      </li>
    </ul>

    <div class="tab-content dashboard-sm-layout" id="pageSmTabContent">
      <div class="tab-pane fade show active dashboard-sm-pane" id="pagePainelMarcadores" role="tabpanel" aria-labelledby="pageTabMarcadores" tabindex="0">
    <div class="row g-2 g-sm-3 mb-3 orcamento-geral-topo justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="orcamento-kpi-layout orcamento-geral-kpi-layout">
          <div class="row g-2 g-sm-3 justify-content-center orcamento-kpi-row-total">
            <div class="col-12 col-sm-8">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-kpi-card-total">
                <div class="card-body orcamento-kpi-card-body py-2 px-2 px-sm-3">
                  <div class="dashboard-kpi-rotulo">orçamento total</div>
                  <div class="orcamento-kpi-ilustra orcamento-kpi-ilustra-total" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                  </div>
                  <strong id="kpiTotal" class="dashboard-kpi-valor orcamento-kpi-valor-total">—</strong>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-2 g-sm-3 orcamento-kpi-row-detalhe">
            <div class="col-6">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-kpi-card-repasse">
                <div class="card-body orcamento-kpi-card-body py-2 px-2 px-sm-3">
                  <div class="dashboard-kpi-rotulo">repasse de parceiros</div>
                  <div class="orcamento-kpi-ilustra orcamento-kpi-ilustra-repasse" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="18" cy="5" r="3"/>
                      <circle cx="6" cy="12" r="3"/>
                      <circle cx="18" cy="19" r="3"/>
                      <path d="m8.59 13.51 6.82 3.65"/>
                      <path d="m15.41 6.49-6.82 3.65"/>
                      <path d="m8.59 10.49-6.82-3.65"/>
                      <path d="m15.41 17.51 6.82-3.65"/>
                    </svg>
                  </div>
                  <strong id="kpiRepasse" class="dashboard-kpi-valor orcamento-kpi-valor-total">—</strong>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-kpi-card-pagamento">
                <div class="card-body orcamento-kpi-card-body py-2 px-2 px-sm-3">
                  <div class="dashboard-kpi-rotulo">pagamento efetuado</div>
                  <div class="orcamento-kpi-ilustra orcamento-kpi-ilustra-pagamento" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                      <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                  </div>
                  <strong id="kpiPagamento" class="dashboard-kpi-valor orcamento-kpi-valor-total">—</strong>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-2 g-sm-3 justify-content-center orcamento-kpi-row-apagar">
            <div class="col-12 col-sm-8">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-kpi-card-apagar">
                <div class="card-body orcamento-kpi-card-body py-2 px-2 px-sm-3">
                  <div class="dashboard-kpi-rotulo">a pagar</div>
                  <div class="orcamento-kpi-ilustra orcamento-kpi-ilustra-apagar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10" />
                      <polyline points="12 6 12 12 16 14" />
                    </svg>
                  </div>
                  <strong id="kpiAPagar" class="dashboard-kpi-valor orcamento-kpi-valor-total">—</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
      </div>

      <div class="tab-pane fade dashboard-sm-pane" id="pagePainelRegistros" role="tabpanel" aria-labelledby="pageTabRegistros" tabindex="0">
    <div class="card shadow-sm border-0 dashboard-tabela-card orcamento-geral-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 orcamento-geral-tabela">
            <colgroup>
              <col class="orcamento-geral-col-item" />
              <col class="orcamento-geral-col-num orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-repasse orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-num orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-apagar orcamento-tabela-desktop-col" />
              <col class="pag-geral-col-stack-orc orcamento-tabela-stack-col" />
              <col class="pag-geral-col-stack-pag orcamento-tabela-stack-col" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="orcamento-geral-col-item">item despesa</th>
                <th scope="col" class="text-end orcamento-geral-col-num orcamento-tabela-desktop-col">orçamento</th>
                <th scope="col" class="text-end orcamento-geral-col-repasse orcamento-tabela-desktop-col">repasse parceiro</th>
                <th scope="col" class="text-end orcamento-geral-col-num orcamento-tabela-desktop-col">pagamento</th>
                <th scope="col" class="orcamento-geral-col-apagar orcamento-tabela-desktop-col">
                  <span class="orcamento-tabela-celula-direita">a pagar</span>
                </th>
                <th scope="col" class="text-end pag-geral-col-stack-orc orcamento-tabela-stack-col">
                  <div class="orcamento-tabela-stack-head" aria-hidden="true">
                    <span>orçamento</span>
                    <span>repasse parceiro</span>
                  </div>
                </th>
                <th scope="col" class="text-end pag-geral-col-stack-pag orcamento-tabela-stack-col">
                  <div class="orcamento-tabela-stack-head" aria-hidden="true">
                    <span>pagamento</span>
                    <span>a pagar</span>
                  </div>
                </th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 orcamento-geral-tabela">
            <colgroup>
              <col class="orcamento-geral-col-item" />
              <col class="orcamento-geral-col-num orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-repasse orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-num orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-apagar orcamento-tabela-desktop-col" />
              <col class="pag-geral-col-stack-orc orcamento-tabela-stack-col" />
              <col class="pag-geral-col-stack-pag orcamento-tabela-stack-col" />
            </colgroup>
            <tbody id="corpoOrcamentoGeral">
              <tr>
                <td colspan="7" class="text-center text-secondary py-4">carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorio.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/pagamentos-geral.js"></script>
</body>
</html>
