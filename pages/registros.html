<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <section class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 card-title mb-3">Lista</h2>
        <div class="table-responsive">
          <table id="tabelaDados" class="table table-striped table-hover align-middle mb-0">
            <thead>
              <tr id="cabecalhoTabela"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
          <p id="vazio" class="text-secondary text-center py-3 mb-0" hidden>
            Nenhum registro encontrado.
          </p>
        </div>
      </div>
    </section>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
