<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Início</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />

</head>

<body class="bg-light page-frame-body">

  <div class="page-frame-content">

    <div class="row g-3 g-md-4 mb-4 home-atalhos">

      <div class="col-6 col-md-3">

        <a href="#" class="home-atalho home-atalho-projecoes" data-pagina="dashboard" aria-label="Projeções">

          <span class="home-atalho-icone" aria-hidden="true">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">

              <path d="M4 19V5M4 19h16M8 17V9m4 8V7m4 10v-4"/>

            </svg>

          </span>

          <span class="home-atalho-texto">projeções</span>

        </a>

      </div>

      <div class="col-6 col-md-3">

        <a href="#" class="home-atalho home-atalho-agenda" data-pagina="agenda" aria-label="Agenda">

          <span class="home-atalho-icone" aria-hidden="true">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">

              <rect x="3" y="4" width="18" height="18" rx="2"/>

              <path d="M16 2v4M8 2v4M3 10h18"/>

            </svg>

          </span>

          <span class="home-atalho-texto">agenda</span>

        </a>

      </div>

      <div class="col-6 col-md-3">

        <a href="#" class="home-atalho home-atalho-registros" data-pagina="registros" aria-label="Registros">

          <span class="home-atalho-icone" aria-hidden="true">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">

              <circle cx="12" cy="8" r="4"/>

              <path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/>

            </svg>

          </span>

          <span class="home-atalho-texto">registros</span>

        </a>

      </div>

      <div class="col-6 col-md-3">

        <a href="#" class="home-atalho home-atalho-planilhas" data-pagina="planilhas" aria-label="Planilhas">

          <span class="home-atalho-icone" aria-hidden="true">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">

              <rect x="3" y="3" width="18" height="18" rx="2"/>

              <path d="M3 9h18M3 15h18M9 3v18"/>

            </svg>

          </span>

          <span class="home-atalho-texto">planilhas</span>

        </a>

      </div>

    </div>



    <section class="card border-0 shadow-sm mb-4 bg-brand text-white">

      <div class="card-body py-4 py-md-5">

        <p class="text-white-50 small text-uppercase mb-2 letter-spacing">Campanha 2026</p>

        <h1 class="h3 h2-md mb-2">Deputado Dr. Eugênio</h1>

        <p class="mb-0 opacity-90 col-lg-8">

          Painel de acompanhamento da campanha: projeções de votação, agenda de atividades,

          registros de contatos e diagnóstico das planilhas conectadas ao Google Sheets.

        </p>

      </div>

    </section>



    <div id="statusInicio" class="alert d-none mb-3" role="status" aria-live="polite"></div>



    <div class="row g-3 g-md-4 mb-4 align-items-stretch">

      <div class="col-12 col-sm-3">

        <div class="home-kpi-layout h-100">

          <div class="home-kpi-col-esq">

            <div class="card shadow-sm border-0 home-kpi-card h-100">

              <div class="card-body d-flex flex-column align-items-center justify-content-center text-center gap-2 py-3">

                <div class="home-kpi-titulo">municípios</div>

                <div class="home-kpi-ilustra home-kpi-ilustra-municipios" aria-hidden="true">

                  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">

                    <path d="M10 52V28l6-3 8 4 10-6 10 5 10-6v30"/>

                    <path d="M22 52V38M32 52V34M42 52V40"/>

                    <circle cx="32" cy="14" r="5"/>

                  </svg>

                </div>

                <strong id="kpiMunicipios" class="home-kpi-valor">—</strong>

              </div>

            </div>

          </div>

          <div class="home-kpi-col-dir">

            <div class="card shadow-sm border-0 home-kpi-card flex-fill">

              <div class="card-body d-flex flex-column align-items-center justify-content-center text-center gap-2 py-3">

                <div class="home-kpi-titulo">população</div>

                <div class="home-kpi-ilustra home-kpi-ilustra-populacao" aria-hidden="true">

                  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">

                    <circle cx="22" cy="22" r="7"/>

                    <circle cx="44" cy="24" r="6"/>

                    <path d="M8 50c0-8 6-12 14-12s14 4 14 12"/>

                    <path d="M36 50c0-6 5-10 12-10 3 0 6 1 8 3"/>

                  </svg>

                </div>

                <strong id="kpiPopulacao" class="home-kpi-valor">—</strong>

              </div>

            </div>

            <div class="card shadow-sm border-0 home-kpi-card flex-fill">

              <div class="card-body d-flex flex-column align-items-center justify-content-center text-center gap-2 py-3">

                <div class="home-kpi-titulo">eleitores</div>

                <div class="home-kpi-ilustra home-kpi-ilustra-eleitores" aria-hidden="true">

                  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">

                    <rect x="14" y="10" width="36" height="44" rx="4"/>

                    <path d="M22 22h20M22 30h14M22 38h18"/>

                    <path d="M32 10v8"/>

                    <circle cx="32" cy="48" r="3" fill="currentColor" stroke="none"/>

                  </svg>

                </div>

                <strong id="kpiEleitores" class="home-kpi-valor">—</strong>

              </div>

            </div>

          </div>

        </div>

      </div>

      <div class="col-12 col-sm-6">

        <div class="card shadow-sm border-0 h-100">

          <div class="card-body">

            <h2 class="h6 text-secondary mb-3 text-center">votação</h2>

            <div class="grafico-wrapper grafico-inicio">

              <canvas id="graficoInicioVotos"></canvas>

            </div>

          </div>

        </div>

      </div>

      <div class="col-12 col-sm-3">

        <div class="card shadow-sm border-0 h-100">

          <div class="card-body">

            <h2 class="h6 text-secondary mb-3 text-center">crescimento</h2>

            <div class="grafico-wrapper grafico-inicio">

              <canvas id="graficoInicioCrescimento"></canvas>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>



  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/config.js"></script>

  <script src="../js/auth.js"></script>

  <script src="../js/navegacao.js"></script>

  <script src="../js/inicio.js"></script>

</body>

</html>
