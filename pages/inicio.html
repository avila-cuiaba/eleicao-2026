<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Início</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="../css/style.css" />

</head>

<body class="bg-light page-frame-body">

  <div class="page-frame-content">

    <div id="statusInicio" class="alert d-none mb-3" role="status" aria-live="polite"></div>



    <div class="row g-3 g-md-4 mb-4 align-items-start">

      <div class="col-12 col-lg-4">

        <div class="home-kpi-layout">

          <div class="home-kpi-col-esq">

            <div class="card shadow-sm border-0 home-kpi-card home-kpi-municipios-card">

              <div class="card-body home-kpi-municipios-body d-flex flex-column py-3 px-3 gap-3">

                <div class="home-kpi-municipios-top">

                  <div class="home-kpi-municipios-top-texto">

                    <div class="home-kpi-titulo mb-1">municípios</div>

                  </div>

                  <span id="kpiMunicipios" class="badge rounded-pill home-kpi-total-badge">—</span>

                </div>

                <ul id="listaSubdivisoesMunicipios" class="home-kpi-subdivisoes list-unstyled mb-0" aria-label="Subdivisões"></ul>

              </div>

            </div>

          </div>

          <div class="home-kpi-col-dir">

            <div class="card shadow-sm border-0 home-kpi-card">

              <div class="card-body d-flex flex-column align-items-center justify-content-center text-center gap-2 py-3">

                <div class="home-kpi-titulo">população</div>

                <div class="home-kpi-ilustra home-kpi-ilustra-populacao" aria-hidden="true">

                  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">

                    <circle cx="22" cy="22" r="7"/>

                    <circle cx="44" cy="24" r="6"/>

                    <path d="M8 50c0-8 6-12 14-12s14 4 14 12"/>

                    <path d="M36 50c0-6 5-10 12-10 3 0 6 1 8 3"/>

                  </svg>

                </div>

                <strong id="kpiPopulacao" class="home-kpi-valor">—</strong>

              </div>

            </div>

            <div class="card shadow-sm border-0 home-kpi-card">

              <div class="card-body d-flex flex-column align-items-center justify-content-center text-center gap-2 py-3">

                <div class="home-kpi-titulo">eleitores</div>

                <div class="home-kpi-ilustra home-kpi-ilustra-eleitores" aria-hidden="true">

                  <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5">

                    <rect x="14" y="10" width="36" height="44" rx="4"/>

                    <path d="M22 22h20M22 30h14M22 38h18"/>

                    <path d="M32 10v8"/>

                    <circle cx="32" cy="48" r="3" fill="currentColor" stroke="none"/>

                  </svg>

                </div>

                <strong id="kpiEleitores" class="home-kpi-valor">—</strong>

              </div>

            </div>

          </div>

        </div>

      </div>

      <div class="col-12 col-lg-8">

        <div class="card shadow-sm border-0">

          <div class="card-body">

            <h2 class="h6 text-secondary mb-3 text-center">votação</h2>

            <div class="grafico-wrapper grafico-inicio">

              <canvas id="graficoInicioVotos"></canvas>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>



  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="../js/config.js"></script>

  <script src="../js/auth.js"></script>

  <script src="../js/inicio.js"></script>

</body>

</html>
