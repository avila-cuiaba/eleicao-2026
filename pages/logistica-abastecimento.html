<!DOCTYPE html>
<html lang="pt-BR" class="diario-bordo-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logística — diário bordo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-diario-bordo">
  <div class="page-frame-content">
    <div id="status" class="alert d-none mb-3" role="status" aria-live="polite"></div>

    <div id="diarioBordoKpiPainel" class="diario-bordo-kpi-painel mb-3" aria-label="Resumo do diário de bordo">
      <div class="row g-2">
        <div class="col-6 col-md-3">
          <div class="card dashboard-kpi-card border-0 shadow-sm h-100 diario-bordo-kpi-card">
            <div class="card-body py-2 text-center">
              <div class="dashboard-kpi-rotulo">veículos</div>
              <div class="dashboard-kpi-valor" id="kpiDiarioVeiculos">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card dashboard-kpi-card border-0 shadow-sm h-100 diario-bordo-kpi-card">
            <div class="card-body py-2 text-center">
              <div class="dashboard-kpi-rotulo">lançamentos</div>
              <div class="dashboard-kpi-valor" id="kpiDiarioLancamentos">0</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card dashboard-kpi-card border-0 shadow-sm h-100 diario-bordo-kpi-card">
            <div class="card-body py-2 text-center">
              <div class="dashboard-kpi-rotulo">litros</div>
              <div class="dashboard-kpi-valor" id="kpiDiarioLitros">0,00</div>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card dashboard-kpi-card border-0 shadow-sm h-100 diario-bordo-kpi-card diario-bordo-kpi-card--valor">
            <div class="card-body py-2 text-center">
              <div class="dashboard-kpi-rotulo">valor total</div>
              <div class="dashboard-kpi-valor" id="kpiDiarioValor">0,00</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="tabelaCard" class="card shadow-sm border-0 crud-tabela-card">
      <div class="card-header bg-white border-bottom py-2 px-3">
        <div class="crud-toolbar">
          <button type="button" id="btnNovo" class="btn btn-sm btn-primary">novo</button>
          <label class="crud-busca-campo mb-0" for="buscaDiarioBordo">
            <span class="visually-hidden">buscar</span>
            <span class="crud-busca-inner">
              <span class="crud-busca-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" />
                  <path d="M20 20l-3.5-3.5" />
                </svg>
              </span>
              <input
                type="search"
                id="buscaDiarioBordo"
                class="form-control form-control-sm crud-busca-input"
                placeholder="buscar"
                autocomplete="off"
              />
            </span>
          </label>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm mb-0 crud-tabela diario-bordo-tabela">
            <thead class="table-light">
              <tr id="cabecalhoTabela"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
        </div>
        <p id="vazio" class="text-secondary small text-center py-4 mb-0" hidden>Nenhum registro encontrado.</p>
      </div>
    </div>

    <div class="modal fade" id="modalDiarioBordo" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          <form id="formDiarioBordo">
            <div class="modal-header py-2">
              <h2 class="modal-title h6 mb-0" id="modalTitulo">lançamento</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
              <div id="formCampos" class="diario-bordo-form-campos"></div>
            </div>
            <div class="modal-footer py-2">
              <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">cancelar</button>
              <button type="submit" id="btnSalvar" class="btn btn-sm btn-primary">salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/app-confirm.js"></script>
  <script src="../js/planilha-api.js"></script>
  <script src="../js/master-crud.js"></script>
  <script src="../js/diario-bordo.js"></script>
  <script src="../js/relatorio.js"></script>
</body>
</html>
