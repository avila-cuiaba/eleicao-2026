<!DOCTYPE html>
<html lang="pt-BR" class="mobilizacao-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mobilização em Cuiabá / VG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-mobilizacao page-mobilizacao-perspectiva">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap">
      <div class="card-body py-3">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-lg-7" id="filtroRegioesWrap">
            <div class="small text-secondary mb-2">região / polo</div>
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
          </div>
          <div class="col-12 col-lg-5">
            <label for="buscaPerspectiva" class="small text-secondary mb-2">buscar</label>
            <input
              type="search"
              id="buscaPerspectiva"
              class="form-control form-control-sm"
              placeholder="apoiador, bairro ou origem…"
              autocomplete="off"
            />
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card">
      <div class="card-body p-0">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 px-3 py-2 border-bottom">
          <div class="d-flex align-items-center gap-2">
            <button type="button" id="btnPerspInserir" class="btn btn-sm btn-primary">inserir</button>
            <span class="small text-secondary">perspectiva de voto</span>
          </div>
          <span id="contadorPerspectiva" class="small text-secondary">—</span>
        </div>
        <div class="table-responsive mob-persp-scroll">
          <table class="table table-sm table-hover mb-0 mob-persp-tabela">
            <thead class="table-light">
              <tr id="cabecalhoPerspectivaDesktop" class="mob-persp-thead-desktop"></tr>
              <tr id="cabecalhoPerspectivaMobile" class="mob-persp-thead-mobile"></tr>
            </thead>
            <tbody id="corpoPerspectiva"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalPerspectiva" tabindex="-1" aria-labelledby="modalPerspectivaTitulo" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content contratos-modal-content">
          <form id="formPerspectiva">
            <div class="modal-header py-2">
              <h2 class="modal-title h6 mb-0" id="modalPerspectivaTitulo">registro</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body py-3">
              <div class="mob-persp-modal-ident">
                <div class="mb-3">
                  <label for="perspApoiador" class="form-label small mb-1">apoiador</label>
                  <select id="perspApoiador" class="form-select form-select-sm" required>
                    <option value="">selecione…</option>
                  </select>
                </div>
                <div class="row g-3 mb-3">
                  <div class="col-6">
                    <label for="perspOrigem" class="form-label small mb-1">origem voto</label>
                    <select id="perspOrigem" class="form-select form-select-sm" required>
                      <option value="">selecione…</option>
                      <option value="localizado">localizado</option>
                      <option value="segmento">segmento</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label for="perspVoto" class="form-label small mb-1">voto</label>
                    <input type="text" id="perspVoto" class="form-control form-control-sm" inputmode="numeric" required autocomplete="off" />
                  </div>
                </div>
                <div id="perspLocalWrap" class="mob-persp-campo--inativo">
                  <div class="mb-3">
                    <label for="perspNivelGeral" class="form-label small mb-1">nível geral</label>
                    <select id="perspNivelGeral" class="form-select form-select-sm" disabled>
                      <option value="">selecione…</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="perspBairro" class="form-label small mb-1">bairro / localidade</label>
                    <select id="perspBairro" class="form-select form-select-sm" disabled>
                      <option value="">selecione…</option>
                    </select>
                  </div>
                </div>
                <div class="mb-0 mob-persp-campo--inativo" id="perspSegmentoWrap">
                  <label for="perspSegmento" class="form-label small mb-1">segmento</label>
                  <input
                    type="text"
                    id="perspSegmento"
                    class="form-control form-control-sm"
                    autocomplete="off"
                    placeholder="ex.: profissionais de beleza"
                    disabled
                  />
                </div>
              </div>
            </div>
            <div class="modal-footer py-2 justify-content-center">
              <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">cancelar</button>
              <button type="submit" class="btn btn-sm btn-primary">salvar</button>
            </div>
          </form>
          <div id="perspModalSalvando" class="contratos-modal-salvando d-none" aria-hidden="true" aria-busy="false">
            <div class="spinner-border page-frame-loader-spinner" role="status">
              <span class="visually-hidden">salvando</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorio.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/planilha-api.js"></script>
  <script src="../js/mobilizacao-common.js"></script>
  <script src="../js/app-confirm.js"></script>
  <script src="../js/mobilizacao-perspectiva.js"></script>
</body>
</html>
