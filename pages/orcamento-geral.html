<!DOCTYPE html>
<html lang="pt-BR" class="orcamento-geral-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento — geral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://kit.fontawesome.com/905f5bcd47.js" crossorigin="anonymous" defer></script>
</head>
<body class="bg-light page-frame-body page-orcamento-geral">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="row g-2 g-sm-3 mb-3 orcamento-geral-topo">
      <div class="col-12">
        <div class="orcamento-kpi-layout orcamento-geral-kpi-layout">
          <div class="row g-2 g-sm-3 justify-content-center orcamento-kpi-row-total orcamento-geral-kpi-row-principal">
            <div class="col-4">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-geral-kpi-principal orcamento-geral-kpi-principal--total">
                <div class="card-body orcamento-geral-kpi-principal-body py-2 px-2 px-sm-3">
                  <div class="dashboard-kpi-rotulo">orçamento total</div>
                  <div class="orcamento-geral-kpi-principal-ilustra" aria-hidden="true">
                    <i class="fa-solid fa-sliders" aria-hidden="true"></i>
                  </div>
                  <strong id="kpiTotal" class="dashboard-kpi-valor orcamento-geral-kpi-principal-valor">—</strong>
                </div>
              </div>
            </div>
            <div class="col-4">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-geral-kpi-principal orcamento-geral-kpi-principal--repasse">
                <div class="card-body orcamento-geral-kpi-principal-body py-2 px-2 px-sm-3">
                  <div class="dashboard-kpi-rotulo">repasse parceiros</div>
                  <div class="orcamento-geral-kpi-principal-ilustra" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="18" cy="5" r="3"/>
                      <circle cx="6" cy="12" r="3"/>
                      <circle cx="18" cy="19" r="3"/>
                      <path d="m8.59 13.51 6.82 3.65"/>
                      <path d="m15.41 6.49-6.82 3.65"/>
                      <path d="m8.59 10.49-6.82-3.65"/>
                      <path d="m15.41 17.51 6.82-3.65"/>
                    </svg>
                  </div>
                  <strong id="kpiBonus" class="dashboard-kpi-valor orcamento-geral-kpi-principal-valor">—</strong>
                </div>
              </div>
            </div>
            <div class="col-4">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-geral-kpi-principal orcamento-geral-kpi-principal--proprio">
                <div class="card-body orcamento-geral-kpi-principal-body py-2 px-2 px-sm-3">
                  <div class="dashboard-kpi-rotulo">orçamento próprio</div>
                  <div class="orcamento-geral-kpi-principal-ilustra" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                  </div>
                  <strong id="kpiProprio" class="dashboard-kpi-valor orcamento-geral-kpi-principal-valor">—</strong>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-2 g-sm-3 orcamento-kpi-row-detalhe orcamento-geral-kpi-row-detalhe">
            <div class="col-6">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-geral-kpi-detalhe orcamento-geral-kpi-detalhe--agrupadas">
                <div class="card-body orcamento-geral-kpi-detalhe-body py-2 px-2 px-sm-3">
                  <div class="orcamento-geral-kpi-detalhe-ilustra" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                      <rect x="3" y="3" width="8" height="8" rx="1.5" />
                      <rect x="13" y="3" width="8" height="8" rx="1.5" />
                      <rect x="3" y="13" width="8" height="8" rx="1.5" />
                      <rect x="13" y="13" width="8" height="8" rx="1.5" />
                    </svg>
                  </div>
                  <div class="orcamento-geral-kpi-detalhe-texto">
                    <div class="dashboard-kpi-rotulo">despesas agrupadas</div>
                    <strong id="kpiAgrupadas" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-geral-kpi-detalhe orcamento-geral-kpi-detalhe--estratificadas">
                <div class="card-body orcamento-geral-kpi-detalhe-body py-2 px-2 px-sm-3">
                  <div class="orcamento-geral-kpi-detalhe-ilustra" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                      <path d="M4 5h16" />
                      <path d="M4 9h12" />
                      <path d="M4 13h16" />
                      <path d="M4 17h9" />
                      <path d="M4 21h14" />
                    </svg>
                  </div>
                  <div class="orcamento-geral-kpi-detalhe-texto">
                    <div class="dashboard-kpi-rotulo">despesas estratificadas</div>
                    <strong id="kpiEstratificadas" class="dashboard-kpi-valor">—</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card orcamento-geral-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 orcamento-geral-tabela">
            <colgroup>
              <col class="orcamento-geral-col-item" />
              <col class="orcamento-geral-col-num orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-repasse orcamento-tabela-desktop-col" />
              <col class="orcamento-tabela-stack-col" />
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="orcamento-geral-col-item">item despesa</th>
                <th scope="col" class="text-end orcamento-geral-col-num orcamento-tabela-desktop-col">orçamento</th>
                <th scope="col" class="text-end orcamento-geral-col-repasse orcamento-tabela-desktop-col">repasse parceiro</th>
                <th scope="col" class="text-end orcamento-tabela-stack-col">
                  <div class="orcamento-tabela-stack-head" aria-hidden="true">
                    <span>orçamento</span>
                    <span>repasse parceiro</span>
                  </div>
                </th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 orcamento-geral-tabela">
            <colgroup>
              <col class="orcamento-geral-col-item" />
              <col class="orcamento-geral-col-num orcamento-tabela-desktop-col" />
              <col class="orcamento-geral-col-repasse orcamento-tabela-desktop-col" />
              <col class="orcamento-tabela-stack-col" />
            </colgroup>
            <tbody id="corpoOrcamentoGeral">
              <tr>
                <td colspan="4" class="text-center text-secondary py-4">carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/relatorio.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/orcamento-geral.js"></script>
</body>
</html>
