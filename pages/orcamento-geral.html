<!DOCTYPE html>
<html lang="pt-BR" class="orcamento-geral-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orçamento — geral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-orcamento-geral">
  <div class="page-frame-content">
    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="row g-2 g-sm-3 mb-3 orcamento-geral-topo">
      <div class="col-6 col-md-3">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-geral-kpi-card orcamento-geral-kpi-agrupadas">
          <div class="card-body orcamento-geral-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo">despesas agrupadas</div>
            <strong id="kpiAgrupadas" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card h-100 shadow-sm border-0 dashboard-kpi-card orcamento-geral-kpi-card orcamento-geral-kpi-estratificadas">
          <div class="card-body orcamento-geral-kpi-body py-2 px-2 px-sm-3">
            <div class="dashboard-kpi-rotulo">despesas estratificadas</div>
            <strong id="kpiEstratificadas" class="dashboard-kpi-valor">—</strong>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card h-100 shadow-sm border-0 orcamento-geral-grafico-card">
          <div class="card-body py-2 px-2 px-sm-3 d-flex flex-column">
            <div class="dashboard-kpi-rotulo text-center mb-1">comparativo orçamento × pagamento</div>
            <div id="graficoComparativo" class="orcamento-geral-grafico flex-grow-1" role="img" aria-label="Comparativo orçamento e pagamento"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 dashboard-tabela-card orcamento-geral-tabela-card">
      <div class="card-body p-0 dashboard-tabela-panel">
        <div class="dashboard-tabela-head table-light">
          <table class="table mb-0 orcamento-geral-tabela">
            <thead>
              <tr>
                <th scope="col" class="orcamento-geral-col-item">item despesa</th>
                <th scope="col" class="text-end orcamento-geral-col-num">orçamento</th>
                <th scope="col" class="text-end orcamento-geral-col-num">pagamento</th>
                <th scope="col" class="text-end orcamento-geral-col-num">a pagar</th>
              </tr>
            </thead>
          </table>
        </div>
        <div class="dashboard-tabela-body-scroll">
          <table class="table table-hover mb-0 orcamento-geral-tabela">
            <tbody id="corpoOrcamentoGeral">
              <tr>
                <td colspan="4" class="text-center text-secondary py-4">carregando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/orcamento-geral.js"></script>
</body>
</html>
