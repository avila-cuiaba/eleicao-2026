<!DOCTYPE html>
<html lang="pt-BR" class="contratos-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>contratos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-light page-frame-body page-contratos">
  <div class="page-frame-content">
    <div class="card shadow-sm border-0 mb-3 dashboard-kpis-wrap">
      <div class="card-body py-3">
        <div class="row g-3 align-items-start">
          <div class="col-12 col-lg-5 contratos-filtro-wrap">
            <div class="small text-secondary mb-2">região</div>
            <div id="filtroRegioes" class="dashboard-filtro-regioes" role="group" aria-label="Filtrar por região"></div>
          </div>
          <div class="col-12 col-lg-7 d-none" id="municipiosWrap">
            <div class="small text-secondary mb-2">município</div>
            <div id="filtroMunicipios" class="entregas-filtro-municipios" role="group" aria-label="Selecionar municípios"></div>
          </div>
        </div>
      </div>
    </div>

    <p id="contratosSelecione" class="text-secondary small mb-3">
      selecione uma região para ver os contratos. clique nos municípios para refinar a lista.
    </p>

    <div id="tabelaCard" class="card shadow-sm border-0 crud-tabela-card d-none">
      <div class="card-header bg-white border-bottom py-2 px-3">
        <div class="crud-toolbar">
          <button type="button" id="btnNovo" class="btn btn-sm btn-primary">novo</button>
          <label class="crud-busca-campo mb-0" for="buscaContrato">
            <span class="visually-hidden">buscar contrato</span>
            <span class="crud-busca-inner">
              <span class="crud-busca-icone" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <circle cx="11" cy="11" r="7" />
                  <path d="M20 20l-3.5-3.5" />
                </svg>
              </span>
              <input
                type="search"
                id="buscaContrato"
                class="form-control form-control-sm crud-busca-input"
                placeholder="buscar"
                autocomplete="off"
              />
            </span>
          </label>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm mb-0 crud-tabela contratos-tabela">
            <thead class="table-light">
              <tr id="cabecalhoDesktop" class="contratos-thead-desktop"></tr>
              <tr id="cabecalhoMobile" class="contratos-thead-mobile"></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
        </div>
        <p id="vazio" class="text-secondary small text-center py-4 mb-0" hidden>Nenhum registro encontrado.</p>
      </div>
    </div>

    <div class="modal fade" id="modalContrato" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable modal-lg contratos-modal-dialog">
        <div class="modal-content contratos-modal-content">
          <div id="modalSalvando" class="contratos-modal-salvando d-none" aria-hidden="true">
            <div class="spinner-border text-primary contratos-modal-salvando-spinner" role="status">
              <span class="visually-hidden">Salvando</span>
            </div>
            <span class="contratos-modal-salvando-texto">salvando...</span>
          </div>
          <form id="formContrato">
            <div class="modal-header">
              <h2 class="modal-title h6 mb-0 contratos-modal-titulo" id="modalTituloWrap">
                <span id="modalIcone" class="contratos-modal-icone" aria-hidden="true"></span>
                <span id="modalTitulo">contrato</span>
              </h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body contratos-modal-body">
              <div id="formCampos" class="contratos-form-campos"></div>
            </div>
            <div class="modal-footer">
              <button type="button" id="btnCancelar" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">cancelar</button>
              <button type="submit" id="btnSalvar" class="btn btn-sm btn-primary">salvar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="pageLoader" class="page-frame-loader" role="status" aria-live="polite">
      <div class="spinner-border page-frame-loader-spinner" aria-hidden="true"></div>
      <span class="visually-hidden">Carregando</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/page-loader.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/planilha-api.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/contratos.js"></script>
</body>
</html>
