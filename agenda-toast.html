<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Toast UI | Eleição 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-brand">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Eleição 2026</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">dashboard</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">agenda</a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="agenda.html">fullcalendar</a></li>
              <li><a class="dropdown-item active" href="agenda-toast.html">toast ui</a></li>
              <li><a class="dropdown-item" href="agenda-lista.html">lista</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="verificar.html">planilhas</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html">registros</a></li>
          <li class="nav-item"><button type="button" id="btnSair" class="btn btn-sm btn-outline-light ms-lg-2 mt-2 mt-lg-0">sair</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-3 py-md-4">
    <ul class="nav nav-pills nav-fill flex-nowrap overflow-auto mb-3 small agenda-tabs">
      <li class="nav-item"><a class="nav-link" href="agenda.html">fullcalendar</a></li>
      <li class="nav-item"><a class="nav-link active" href="agenda-toast.html">toast ui</a></li>
      <li class="nav-item"><a class="nav-link" href="agenda-lista.html">lista</a></li>
    </ul>

    <div class="d-flex align-items-center justify-content-between mb-3 gap-2">
      <div>
        <h1 class="h4 mb-0">agenda — toast ui</h1>
        <p class="text-secondary small mb-0">arraste eventos para remarcar</p>
      </div>
      <button type="button" id="btnNova" class="btn btn-sm btn-primary flex-shrink-0">nova atividade</button>
    </div>

    <div id="status" class="alert d-none" role="status" aria-live="polite"></div>

    <div class="card shadow-sm">
      <div class="card-body p-2 p-md-3">
        <div id="calendario-toast"></div>
      </div>
    </div>
  </main>

  <!-- Modal: nova atividade -->
  <div class="modal fade" id="modalEvento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formEvento">
          <div class="modal-header">
            <h2 class="modal-title h5">nova atividade</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="evTitulo" class="form-label">título</label>
              <input type="text" id="evTitulo" class="form-control" required />
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="evDiaInteiro" />
              <label class="form-check-label" for="evDiaInteiro">dia inteiro</label>
            </div>
            <div class="row g-3">
              <div class="col-12 col-sm-6">
                <label for="evInicio" class="form-label">início</label>
                <input type="datetime-local" id="evInicio" class="form-control" required />
              </div>
              <div class="col-12 col-sm-6">
                <label for="evFim" class="form-label">fim</label>
                <input type="datetime-local" id="evFim" class="form-control" />
              </div>
            </div>
            <div class="mb-3 mt-3">
              <label for="evLocal" class="form-label">local</label>
              <input type="text" id="evLocal" class="form-control" />
            </div>
            <div class="mb-3">
              <label for="evDescricao" class="form-label">descrição</label>
              <textarea id="evDescricao" rows="2" class="form-control"></textarea>
            </div>
            <div class="mb-1">
              <label for="evLembrete" class="form-label">lembrete (minutos antes)</label>
              <input type="number" id="evLembrete" class="form-control" min="0" />
            </div>
            <div id="statusModal" class="alert d-none mt-3" role="alert"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">cancelar</button>
            <button type="submit" id="btnSalvarEvento" class="btn btn-primary">salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="border-top bg-white py-3 mt-4">
    <div class="container">
      <small class="text-secondary">projeto eleição 2026 · toast ui calendar</small>
    </div>
  </footer>

  <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.min.js"></script>
  <script src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/agenda-api.js"></script>
  <script src="js/agenda-toast.js"></script>
</body>
</html>
