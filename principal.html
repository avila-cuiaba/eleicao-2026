<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eleição 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light app-shell" data-pagina="inicio">
  <div id="sidebarBackdrop" class="app-sidebar-backdrop" aria-hidden="true"></div>

  <aside id="appSidebar" class="app-sidebar" aria-label="Menu lateral"></aside>

  <div class="app-content">
    <header class="app-header">
      <div class="app-header-start">
        <button type="button" id="btnMenuToggle" class="btn btn-sm btn-menu-toggle d-lg-none" aria-label="Abrir menu">
          &#9776;
        </button>
        <div class="app-header-texto">
          <h1 id="appHeaderTitulo" class="app-header-title h5 mb-0">início</h1>
          <p id="appHeaderSub" class="app-header-sub text-secondary small mb-0">painel da campanha</p>
        </div>
      </div>
      <div class="app-header-acoes">
        <div class="dropdown app-header-relatorio-menu" id="relatorioShellMenuWrap" hidden>
          <button
            type="button"
            id="btnRelatorioShellDropdown"
            class="btn-icone-atualizar app-header-relatorio"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            aria-label="relatórios"
            title="relatórios"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true">
              <path d="M6 9V2h12v7"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
          </button>
          <ul class="dropdown-menu dropdown-menu-end app-header-relatorio-dropdown-menu" id="relatorioShellDropdownLista"></ul>
        </div>
        <button type="button" id="btnRelatorioShell" class="btn-icone-atualizar app-header-relatorio" aria-label="Imprimir relatório" title="imprimir relatório" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true">
            <path d="M6 9V2h12v7"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
        </button>
        <button
          type="button"
          id="btnExportarXlsShell"
          class="btn-icone-atualizar app-header-exportar-xls"
          aria-label="exportar XLS"
          title="exportar XLS"
          hidden
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M8 7h8M8 12h8M8 17h5"/>
          </svg>
        </button>
        <button type="button" id="btnAtualizarShell" class="btn-icone-atualizar app-header-atualizar" aria-label="Atualizar" title="atualizar" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" aria-hidden="true">
            <path d="M1 4v6h6M23 20v-6h-6"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main app-main-frame">
      <!-- Cada formulário/tela é um HTML separado carregado aqui (como um "include" via frame) -->
      <iframe
        id="appFrame"
        name="appFrame"
        class="app-frame"
        src="pages/inicio.html"
        title="Conteúdo da página"
      ></iframe>
    </main>

    <footer class="app-footer">
      <small class="text-secondary">projeto Eleição 2026 &middot; deputado estadual Dr. Eugênio</small>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/relatorio.js"></script>
  <script src="js/principal.js"></script>
</body>
</html>
